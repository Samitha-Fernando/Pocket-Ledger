<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Pocket Ledger</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #171717; --muted: #737373; --accent: #0f766e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --accent: #5eead4; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 0; background: var(--accent); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>Pocket Ledger needs a connection to show your up-to-date finances.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
